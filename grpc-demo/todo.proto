syntax="proto3";

package todoPackage;


service Todo {
  rpc createTodo(TodoItem) returns (TodoItem);
  rpc readTodos(noArg) returns (TodoItems);
  rpc readTodoStream(noArg) returns (stream TodoItem);
}

message noArg {}

message TodoItem {
  int32 id = 1;
  string text = 2;
}

message TodoItems {
  repeated TodoItem items = 1;
}